  <h1>BraillePay is offline</h1>
  <p>The app's screens are saved on this device, but balances, transfers and QR verification need a connection to the BraillePay server.</p>
  <p><strong>Being offline never means a payment went through.</strong> When you reconnect, check your transaction history before paying again.</p>
