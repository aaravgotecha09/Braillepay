# Render Blueprint for the BraillePay API.
# Creating a Blueprint from this file does NOT touch any existing live service.
# Secrets are declared with sync: false (Render prompts for them) or generateValue: true.
# No secret value is stored in this file.
services:
  - type: web
    name: braillepay-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: braillepay
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "10080"
      # Replace the hostnames below with the real Vercel frontend domain before use.
      - key: CORS_ORIGINS
        value: https://braillepay.vercel.app
      - key: WEBAUTHN_RP_ID
        value: braillepay.vercel.app
      - key: WEBAUTHN_RP_NAME
        value: BraillePay
      - key: WEBAUTHN_ORIGINS
        value: https://braillepay.vercel.app
      - key: DEMO_MODE
        value: "true"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"
      - key: RAZORPAY_ENABLED
        value: "false"
      - key: RAZORPAY_MODE
        value: test
      - key: RAZORPAY_LIVE_APPROVED
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
