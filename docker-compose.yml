version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - braillepay_mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: braillepay
      JWT_SECRET: change-this-to-a-long-random-string
      CORS_ORIGINS: http://localhost:5500
      DEMO_MODE: "true"
      PORT: 8000

volumes:
  braillepay_mongo_data:
